services:
  next:
    build:
      context: .
      dockerfile: Dockerfile
      # 构建期的 DATABASE_URL 由 npm run build:docker 经 dotenv -e .env.docker 注入，
      # 不在此处传 build arg：Dockerfile 未声明对应 ARG，且构建参数会留在镜像历史里
    container_name: photo-map-next
    env_file:
      - .env.docker
    ports:
      - '3000:3000'
    volumes:
      - /mnt/map-photos:/app/photos
    restart: always
    networks:
      - photo_map_network
    # 映射宿主机host，需要访问Ollama服务
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  photo_map_network:
    external: true
